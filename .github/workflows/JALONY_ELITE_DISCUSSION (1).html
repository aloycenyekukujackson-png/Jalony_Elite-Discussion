<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f6f5;--card:#fff;--text:#12302d;--mut:#5c7a76;--line:#dbe7e4;--side:#061428;--side2:#0e6b45;--hdr:#071a3a;--acc:#1456b8;--warn:#c0392b;--ok:#1a8a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1514;--card:#13211f;--text:#e3f0ee;--mut:#8fb0aa;--line:#24403c;--side:#040c1c;--hdr:#050f24;--acc:#3b82e0}}
:root[data-theme="dark"]{--bg:#0b1514;--card:#13211f;--text:#e3f0ee;--mut:#8fb0aa;--line:#24403c;--side:#040c1c;--hdr:#050f24;--acc:#3b82e0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
header{background:var(--hdr);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .t{font-weight:700;font-size:15px;flex:1}
header .lg{width:38px;height:38px;border-radius:50%;background:transparent;object-fit:contain}
.ib{background:var(--side2);border:0;color:#fff;min-width:40px;height:40px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center}
.ib .ic{width:20px;height:20px}
.hero{background:var(--side);color:#fff;padding:22px 16px 26px;display:flex;gap:14px;align-items:center}
.hero img{width:78px;height:78px;border-radius:50%;background:transparent;object-fit:contain;display:block;animation:flt 4s ease-in-out infinite}
.hero h1{margin:0;font-size:24px;letter-spacing:.04em;background:linear-gradient(90deg,#fff,#b9d4ff 45%,#7ff0b4);-webkit-background-clip:text;background-clip:text;color:transparent}.hero h1 small{display:block;font-size:12px;letter-spacing:.42em;color:#d9b24c;-webkit-text-fill-color:#d9b24c;margin-top:2px}.hero p{margin:6px 0 0;color:#9cc7ee;font-size:13px}
main{padding:14px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
input[type=radio],input[type=checkbox]{width:auto;margin:3px 0 0;flex:none}
label.dim{display:block;margin-bottom:4px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;margin:0 6px 6px 0;display:inline-flex;align-items:center;gap:8px}
button.b.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.n{width:26px;color:var(--mut);font-size:13px}.nm{flex:1}
.x{background:none;border:0;color:var(--warn);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;padding:4px}
.pill{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
.slide{background:var(--side);color:#fff;border-radius:14px;padding:20px;min-height:150px}
.slide h3{margin:0 0 8px;font-size:20px}.slide p{margin:0;white-space:pre-wrap;color:#cfe8e3}
.dutyr{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.dutyr.today{outline:2px solid var(--acc);border-radius:10px;padding:4px}
.per{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center}
.per input{margin:0}
a.lk{color:var(--acc);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.dim{color:var(--mut);font-size:13px}
.vp iframe,.vp video{width:100%;height:auto;aspect-ratio:16/9;min-height:200px;border:0;border-radius:12px;background:#000;margin-bottom:10px}
#ban{display:none;position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:#c9792b;color:#fff;border-radius:14px;padding:14px;z-index:30;font-weight:700;align-items:center;gap:10px}
#ban button{background:#fff;color:#7a3f00;border:0;border-radius:10px;padding:8px 14px;font-weight:700;margin-left:auto}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);z-index:20;display:none}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--side);color:#fff;z-index:21;-webkit-transform:translateX(-100%);transform:translateX(-100%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;overflow-y:auto}
#dr.o{-webkit-transform:none;transform:none}
#dr .h{font-weight:800;letter-spacing:.06em;text-align:center;margin-bottom:14px}
#dr input{background:#12403d;border-color:#12403d;color:#fff}
.mi{display:flex;gap:12px;align-items:center;padding:13px 12px;border-radius:10px;cursor:pointer;font-size:16px;color:#e3f0ee}
.mi .ic{width:20px;height:20px}
.mi.a{background:var(--side2)}
.view{display:none}.view.a{display:block}
/* comments */
.cm{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.cmh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cm p{white-space:pre-wrap;margin:8px 0}
.rp{border-left:3px solid var(--acc);padding:4px 0 4px 10px;margin:8px 0;white-space:pre-wrap}
.cmf{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cmf .b{margin:0}
.rf{margin-top:8px}
/* quiz */
.qb{margin-bottom:16px}
.qt{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.opt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--bg)}
.opt>span{flex:1}
.opt.sel{border-color:var(--acc);background:rgba(26,122,109,.14)}
.opt.ok{border-color:var(--ok);background:rgba(26,138,74,.16);cursor:default}
.opt.bad{border-color:var(--warn);background:rgba(192,57,43,.14);cursor:default}
.opt.ok .ic{color:var(--ok)}.opt.bad .ic{color:var(--warn)}
.okc{color:var(--ok)}.badc{color:var(--warn)}
.tbar{position:-webkit-sticky;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tbar b{font-size:24px;font-variant-numeric:tabular-nums}
.tbar b.low{color:var(--warn)}
details summary{cursor:pointer;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}

/* ---- JALONY_ELITE: animated home, splash, about ---- */
#bgc{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;display:none}
body.home #bgc{display:block}
body.home{background:transparent}
body.home .hero{background:linear-gradient(180deg,rgba(2,10,30,.55),rgba(2,10,30,0))}
body.home .card,body.home .stat{background:rgba(8,22,44,.62);color:#eaf6ff;border:1px solid rgba(120,190,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
body.home .dim{color:#a9c8d8}
body.home .row{border-color:rgba(120,190,255,.18)}
body.home a.lk{color:#7fd8ff}
body.home button.b{background:linear-gradient(135deg,#1560c8,#0e8a55)}
body.home button.b.g{background:transparent;color:#7fd8ff;border:1px solid #7fd8ff}
.lgw{position:relative;display:inline-block;flex:none;width:78px;height:78px}
.lgw::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#1560c8,#0e8a55,#d9b24c,#1560c8);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 6s linear infinite}
.lgw::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(40,120,255,.35),transparent 65%);animation:pls 3s ease-in-out infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pls{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.home main>section>*{animation:rise .6s both}
body.home main>section>*:nth-child(2){animation-delay:.1s}body.home main>section>*:nth-child(3){animation-delay:.2s}
body.home main>section>*:nth-child(4){animation-delay:.3s}body.home main>section>*:nth-child(5){animation-delay:.4s}
#spl{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:radial-gradient(circle at 50% 40%,#0a1f4a,#02060f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s,visibility .7s;color:#fff}
#spl.off{opacity:0;visibility:hidden}
#spl img{width:170px;height:170px;border-radius:50%;animation:zin 1.3s cubic-bezier(.2,.9,.3,1.2) both,pls 2.4s 1.3s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(40,120,255,.7))}
#spl b{font-size:26px;letter-spacing:.14em;background:linear-gradient(90deg,#fff,#9cc7ee,#7ff0b4);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s .6s both}
#spl span{font-size:13px;letter-spacing:.5em;color:#d9b24c;animation:rise .9s .9s both}
@keyframes zin{from{opacity:0;transform:scale(.3) rotate(-120deg)}to{opacity:1;transform:none}}
.ab h3{margin:14px 0 6px;font-size:15px}.ab p{margin:0 0 8px}.ab ul{margin:0 0 8px;padding-left:20px}.ab li{margin-bottom:5px}
.dev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.dev:last-child{border:0}
.dev .ic{color:var(--acc)}.dev a{color:inherit;text-decoration:none;font-weight:600;word-break:break-all}
.ft{text-align:center;font-size:12px;color:var(--mut);margin:6px 0 24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

#auth{position:fixed;top:0;right:0;bottom:0;left:0;z-index:150;display:flex;background:radial-gradient(circle at 50% 30%,#0a1f4a,#02060f 75%);align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.auth-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;color:var(--text)}
.auth-box input{margin-bottom:10px}
.auth-logo{font-weight:800;font-size:22px;letter-spacing:.06em;text-align:center}
.auth-logo small{display:block;font-size:12px;letter-spacing:.4em;color:#d9b24c;margin-top:4px}
.ft{text-align:center;font-size:12px;color:var(--mut);margin:16px 0 24px;line-height:1.6}
.pol h3{margin:14px 0 6px;font-size:15px}.pol p,.pol li{font-size:14px}.pol ul{padding-left:20px;margin:0 0 8px}
</style>
</head>

let ctx=null,fired={},master=null;
function audio(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();$('snds').textContent=t('on');
 try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}return true}catch(e){return false}}
/* Sauti ya kengele halisi: sine + harmonics za kengele, kila kipindi kina wimbo wake (kuanza = unapanda, kuisha = unashuka) */
function bell(t0,f,v,d){[[1,1],[2.01,.45],[2.76,.3],[4.2,.14],[5.4,.07]].forEach(([m,a])=>{const o=ctx.createOscillator(),n=ctx.createGain();o.type='sine';o.frequency.value=f*m;
 n.gain.setValueAtTime(.0001,t0);n.gain.linearRampToValueAtTime(v*a,t0+.008);n.gain.exponentialRampToValueAtTime(.0001,t0+d/(m>1?m*.55:1));o.connect(n);n.connect(master);o.start(t0);o.stop(t0+d+.1)})}
const MEL={s:[[659,0],[784,.42],[1047,.84],[1319,1.35]],e:[[1047,0],[784,.5],[659,1],[523,1.5],[392,2.1]]};
function ring(k,msg){if(!audio())return;k=k==='e'?'e':'s';try{master&&master.disconnect()}catch(e){}
 master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);const gap=k==='s'?3.2:3.8;
 for(let r=0;r<3;r++)MEL[k].forEach(([f,o])=>bell(ctx.currentTime+.05+r*gap+o,f,.34,2.4));
 try{navigator.vibrate&&navigator.vibrate(k==='s'?[400,200,400,200,400]:[800,300,800])}catch(e){}
 try{if(msg&&'Notification' in window&&Notification.permission==='granted')new Notification('JALONY_ELITE DISCUSSION',{body:msg,icon:document.querySelector('header .lg').src})}catch(e){}}
function stopRing(){try{if(master&&ctx){master.gain.cancelScheduledValues(0);master.gain.setValueAtTime(0,ctx.currentTime)}navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function banner(m){$('bt').textContent=m;$('ban').style.display='flex'}
$('bs').onclick=()=>{$('ban').style.display='none';stopRing()};
function tick(){const d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes()),day=d.toDateString();
 if(d.getSeconds()<5)periods.forEach(p=>[['s',p.s,'ringS'],['e',p.e,'ringE']].forEach(([k,v,msg])=>{const key=day+p.n+k+v;
  if(v===hm&&!fired[key]){fired[key]=1;const mm=t(msg)+' '+t('per')+' '+p.n;ring(k,mm);banner(mm)}}));
 const ev=[];periods.forEach(p=>[['s',p.s],['e',p.e]].forEach(([k,v])=>{if(!v)return;const[h,m]=v.split(':'),x=new Date();x.setHours(+h,+m,0,0);if(x>d)ev.push([x,p.n,k])}));

function quizIntro(q){return `<div class="dim">${t('qConcept')}</div><h3 style="margin:2px 0 6px">${esc(q.c)}</h3><div class="dim" style="margin-bottom:10px">${q.q.length} ${t('qQs')} · 5:00</div><input id="qn" list="stl" placeholder="${t('qName')}" value="${esc(qName)}" autocomplete="off"><button class="b" id="qgo">${ic('clock')}${t('qStart')}</button>`}

 +q.q.map((x,i)=>`<div class="qb"><div class="qt"><span>${i+1}.</span><span>${esc(x.t)}</span></div>`+x.o.map((o,j)=>`<label class="opt ${run.ans[i]===j?'sel':''}"><input type="radio" name="r${i}" data-qa="${i}" value="${j}" ${run.ans[i]===j?'checked':''}><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join('')+`</div>`).join('')

 +q.q.map((x,i)=>{const a=r.ans[i],good=a===x.a;return `<div class="qb"><div class="qt"><span>${i+1}.</span><span>${esc(x.t)}</span><span class="${good?'okc':'badc'}">${ic(good?'check':'x')}</span></div>`

 const b=g.createLinearGradient(0,0,bW,bH);b.addColorStop(0,'#020a22');b.addColorStop(.5,'#04122e');b.addColorStop(1,'#02150f');g.fillStyle=b;g.fillRect(0,0,bW,bH);

 [['rgba(30,110,255,.16)',0,.0009],['rgba(20,200,120,.13)',2,.0007]].forEach(([c,ph,sp],i)=>{g.beginPath();g.moveTo(0,bH);for(let x=0;x<=bW;x+=12)g.lineTo(x,bH*(.78+i*.06)+Math.sin(x*.008+t*sp+ph)*bH*.04+Math.sin(x*.015-t*sp*1.4)*bH*.015);g.lineTo(bW,bH);g.closePath();g.fillStyle=c;g.fill()});
 bP.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=bH+5;p.x=Math.random()*bW}if(p.x<-5)p.x=bW+5;if(p.x>bW+5)p.x=-5;

 for(let i=0;i<bP.length;i++)for(let j=i+1;j<bP.length;j++){const dx=bP[i].x-bP[j].x,dy=bP[i].y-bP[j].y,d=dx*dx+dy*dy;if(d<10000){g.strokeStyle=`rgba(140,200,255,${(1-d/10000)*.22})`;g.lineWidth=.6;g.beginPath();g.moveTo(bP[i].x,bP[i].y);g.lineTo(bP[j].x,bP[j].y);g.stroke()}}

const USERS_KEY='bhrm_users', SESS_KEY='bhrm_sess';

async function hsh(s){
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jy1|'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;const z='jy1|'+s;for(let i=0;i<z.length;i++)h=((h<<5)+h+z.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16)}

function auLogin(u){cu=u;sv(SESS_KEY,u.r);qName=u.n;au('auth').style.display='none';go('dash')}
async function auReg(){
 const n=au('rN').value.trim(),e=au('rE').value.trim().toLowerCase(),m=au('rM').value.trim(),p=au('rP').value,r=au('rR').value.trim().toUpperCase();
 if(!n||!e||!m||!p||!r)return auErr(t('auFill'));
 if(p.length<6)return auErr(t('auPw'));
 if(!au('rOk').checked)return auErr(t('auAgree'));
 if(users.some(x=>x.r===r||x.e===e))return auErr(t('auExists'));
 const u={n,e,m,r,h:await hsh(p),t:Date.now()};

 if(!students.some(s=>s.n.toLowerCase()===n.toLowerCase())){students.push({n,p:m+' · '+r});sv('bhrm_st',students);rs();rgp()}
 auLogin(u)}

  return q.q.map((qq,i)=>{const ch=a[i],ok=ch===qq.a;
   return `<div style="margin:8px 0"><b>${i+1}. ${esc(qq.t)}</b><br><span class="dim">${t('dYour')}: ${ch===undefined?'—':esc(qq.o[ch])} · <span class="${ok?'okc':'badc'}">${ok?t('dOK'):t('dNo')}</span>${ok?'':` · ${t('dRight')}: ${esc(qq.o[qq.a])}`}</span></div>`}).join('')};
 const rows=my.slice().reverse().map(r=>{const q=quizzes.find(x=>x.id===r.qid);
  return `<details class="qa"><summary><span class="nm">${esc(q?q.c:'Quiz')}<br><span class="dim">${new Date(r.ts).toLocaleString()}</span></span><span class="pill">${r.s}/${r.tot}</span></summary>${det(r)}</details>`}).join('');
 d.innerHTML=`<div class="grid"><div class="stat"><b>${my.length}</b><span>${t('dQuiz')}</span></div><div class="stat"><b>${avg}%</b><span>${t('dAvg')}</span></div></div>
 <div class="card" style="margin-top:14px"><h2>${t('dProf')}</h2><div><b>${esc(cu.n)}</b></div><div class="dim">${t('fR')}: ${esc(cu.r)}</div><div class="dim">${esc(cu.e)} · ${esc(cu.m)}</div></div>
 <div class="card"><h2>${t('dAns')}</h2>${rows||`<div class="dim">${t('dNone')}</div>`}</div>
 <button class="b" data-go="quiz">${ic('quiz')}${t('dStart')}</button><button class="b g" id="auOutB">${t('dOut')}</button>`;
 const o=d.querySelector('#auOutB');if(o)o.onclick=auOut}
